name: Ciclo Unico 24x7

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: viralizougoiania-ciclo-unico
  cancel-in-progress: true

jobs:
  ciclo-unico:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Obter token OIDC temporario
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viralizougoiania")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Executar cadeia de ciclos a cada 10 minutos (24/7)
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TOTAL_CYCLES=4
          INTERVAL_SECONDS=600

          for ((i=1; i<=TOTAL_CYCLES; i++)); do
            echo "=========================================================="
            echo "🚀 [CICLO $i/$TOTAL_CYCLES] Iniciando varredura 24/7 - $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "=========================================================="

            BODY_FILE="$(mktemp)"
            HTTP_CODE="$(curl -sS --connect-timeout 20 --max-time 120 --retry 2 --retry-all-errors --retry-delay 5 \
              -o "$BODY_FILE" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              -H "x-automation-secret: viralizou-radar-secret-2026" \
              -H "Content-Type: application/json" \
              "https://viralizougoiania.vercel.app/api/automation/radar-cycle?secret=viralizou-radar-secret-2026")" || HTTP_CODE="000"

            echo "Status HTTP recebido da Vercel: $HTTP_CODE"
            if [ -f "$BODY_FILE" ] && [ -s "$BODY_FILE" ]; then
              cat "$BODY_FILE"
              echo
              python3 .github/scripts/parse_radar_result.py "$BODY_FILE" || true
              rm -f "$BODY_FILE"
            fi

            # Se for o último ciclo da sessão (minuto 30), agenda a próxima rodada da cadeia perpétua
            if [ "$i" -eq "$TOTAL_CYCLES" ]; then
              echo "----------------------------------------------------------"
              echo "🔄 Disparando o próximo runner da cadeia perpétua 24/7..."
              echo "----------------------------------------------------------"
              gh workflow run radar-pilot.yml --ref main || true
              echo "✅ Próximo ciclo delegado com sucesso para o novo runner!"
              break
            fi

            echo "⏳ Aguardando exatamente 10 minutos ($INTERVAL_SECONDS segundos) para a próxima varredura e liberação de fila..."
            sleep "$INTERVAL_SECONDS"
          done
