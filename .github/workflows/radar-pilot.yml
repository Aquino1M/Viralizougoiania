name: Ciclo Unico 24x7

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-pilot.yml"
      - "lib/github-oidc.ts"
      - "app/api/automation/radar-cycle/route.ts"
      - "lib/category-classifier.ts"

permissions:
  contents: read
  id-token: write

concurrency:
  group: viralizougoiania-ciclo-unico
  cancel-in-progress: false

jobs:
  ciclo-unico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter token OIDC temporario
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Mostrar claims seguros do OIDC
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64
          token=os.environ["OIDC_TOKEN"]
          body=token.split(".")[1]
          body += "=" * (-len(body) % 4)
          p=json.loads(base64.urlsafe_b64decode(body.encode()))
          safe={k:p.get(k) for k in ["iss","aud","repository","ref","workflow_ref","job_workflow_ref","sub","event_name"]}
          print(json.dumps(safe, ensure_ascii=False))
          PY

      - name: Executar 1 comando no servidor Vercel
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then sleep 25; fi
          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS --retry 2 --retry-delay 5             -o "$BODY_FILE" -w "%{http_code}"             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN"             -H "Content-Type: application/json"             "https://viralizougoiania-grupo-aquino.vercel.app/api/automation/radar-cycle")"
          cat "$BODY_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "HTTP $HTTP_CODE"
            exit 22
          fi
