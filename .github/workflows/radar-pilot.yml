name: Ciclo Unico 24x7

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: viralizougoiania-ciclo-unico
  cancel-in-progress: false

jobs:
  ciclo-unico:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter token OIDC temporario
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL             -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Executar ciclo unico no servidor Vercel
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS --retry 2 --retry-delay 5             -o "$BODY_FILE" -w "%{http_code}"             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN"             -H "Content-Type: application/json"             "https://viralizougoiania-grupo-aquino.vercel.app/api/automation/radar-cycle")"
          cat "$BODY_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "HTTP $HTTP_CODE"
            exit 22
          fi
