name: Ciclo Unico 24x7

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: viralizougoiania-ciclo-unico
  cancel-in-progress: false

jobs:
  ciclo-unico:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Obter token OIDC temporario
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=viralizougoiania")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Executar ciclo unico completo - ate 300 posts + radar + futebol + audiencia
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          BODY_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS --connect-timeout 20 --max-time 420 --retry 2 --retry-all-errors --retry-delay 10 \
            -o "$BODY_FILE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            -H "x-automation-secret: viralizou-radar-secret-2026" \
            -H "Content-Type: application/json" \
            "https://viralizougoiania.vercel.app/api/automation/radar-cycle?secret=viralizou-radar-secret-2026")"
          cat "$BODY_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "HTTP $HTTP_CODE"
            exit 22
          fi
          python3 - "$BODY_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result = json.load(f)
          print("Resumo radar: found={found} newItems={newItems} added={added} skipped={skipped} reason={reason}".format(
              found=result.get("found", "?"),
              newItems=result.get("newItems", "?"),
              added=result.get("added", "?"),
              skipped=result.get("skipped", False),
              reason=result.get("reason", ""),
          ))
          if result.get("ok") is not True:
              print("Falha do ciclo: API respondeu HTTP de sucesso mas ok não é true.", file=sys.stderr)
              sys.exit(23)
          if result.get("skipped") and result.get("reason") not in ("paused", "already-running"):
              print("Ciclo não executado: " + str(result.get("reason", "ignorado")), file=sys.stderr)
              sys.exit(24)
          if result.get("newItems", 0) > 0 and result.get("added", 0) == 0:
              print("Aviso: Foram encontradas notícias novas, mas zero foram adicionadas à fila neste ciclo.", file=sys.stderr)
          if result.get("errors"):
              print("Avisos do ciclo: " + " | ".join(map(str, result["errors"])), file=sys.stderr)
          PY
          rm -f "$BODY_FILE"
